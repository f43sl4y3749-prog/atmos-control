<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
  <title id="t">atmos-control capture modes</title>
  <desc id="d">Three capture modes compared. Personalized (headphones): no driver, personalized HRTF yes, source system mix. Surround 7.1.4: driver yes, HRTF no, source 12-channel Apple Music. Stereo (virtual device): driver yes, HRTF no, source any.</desc>
  <style>
    .ink{fill:#E9EAEC}.ink2{fill:#9A9DA2}.mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
    .acc{fill:#57D1DB}.rule{stroke:#26282C;stroke-width:1}
  </style>

  <rect x="1" y="1" width="1278" height="258" rx="14" fill="#161719" stroke="#26282C"/>
  <text class="mono ink2" x="40" y="40" font-size="13" letter-spacing="1">capture modes</text>

  <!-- column separators + row rules -->
  <g class="rule">
    <line x1="300" y1="62" x2="300" y2="244"/>
    <line x1="620" y1="62" x2="620" y2="244"/>
    <line x1="920" y1="62" x2="920" y2="244"/>
    <line x1="80" y1="118" x2="1200" y2="118"/>
    <line x1="80" y1="170" x2="1200" y2="170"/>
    <line x1="80" y1="209" x2="1200" y2="209"/>
  </g>

  <!-- headers -->
  <text class="mono acc"  x="330" y="88" font-size="20">Personalized</text>
  <text class="ink2"      x="330" y="108" font-size="13">headphones</text>
  <text class="mono ink"  x="650" y="88" font-size="20">Surround</text>
  <text class="ink2"      x="650" y="108" font-size="13">7.1.4</text>
  <text class="mono ink"  x="950" y="88" font-size="20">Stereo</text>
  <text class="ink2"      x="950" y="108" font-size="13">virtual device</text>

  <!-- row labels -->
  <text class="ink2" x="80" y="150" font-size="14">driver</text>
  <text class="ink2" x="80" y="194" font-size="14">personalized HRTF</text>
  <text class="ink2" x="80" y="232" font-size="14">source</text>

  <!-- row: driver -->
  <text class="mono ink2" x="330" y="150" font-size="15">no</text>
  <text class="mono ink"  x="650" y="150" font-size="15">yes</text>
  <text class="mono ink"  x="950" y="150" font-size="15">yes</text>

  <!-- row: personalized HRTF (accent yes under Personalized) -->
  <circle class="acc" cx="336" cy="189" r="4"/>
  <text class="mono acc"  x="350" y="194" font-size="15">yes</text>
  <text class="mono ink2" x="650" y="194" font-size="15">no</text>
  <text class="mono ink2" x="950" y="194" font-size="15">no</text>

  <!-- row: source -->
  <text class="mono ink2" x="330" y="232" font-size="14">system mix</text>
  <text class="mono ink2" x="650" y="232" font-size="14">12ch Apple Music</text>
  <text class="mono ink2" x="950" y="232" font-size="14">any</text>
</svg>
