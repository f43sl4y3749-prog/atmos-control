<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
  <title id="t">atmos-control signal path</title>
  <desc id="d">System audio is captured through a process tap or virtual 7.1.4 driver, rendered by AUSpatialMixer with personalized HRTF and head tracking, and played back on AirPods.</desc>
  <style>
    .ink{fill:#E9EAEC}.ink2{fill:#9A9DA2}.mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
    .box{fill:none;stroke:#33353A;stroke-width:1}.acc{stroke:#57D1DB}.accf{fill:#57D1DB}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#5A5D64" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1278" height="218" rx="14" fill="#161719" stroke="#26282C"/>
  <text class="mono ink2" x="40" y="40" font-size="13" letter-spacing="1">signal path</text>

  <!-- stage 1: System audio -->
  <rect class="box" x="111" y="72" width="200" height="88" rx="9"/>
  <text class="mono ink" x="211" y="112" font-size="17" text-anchor="middle">System audio</text>
  <text class="ink2" x="211" y="134" font-size="12.5" text-anchor="middle">any app &#183; the system mix</text>

  <!-- stage 2: Capture -->
  <rect class="box" x="357" y="72" width="250" height="88" rx="9"/>
  <text class="mono ink" x="482" y="107" font-size="17" text-anchor="middle">Capture</text>
  <text class="ink2" x="482" y="129" font-size="12.5" text-anchor="middle">process tap /</text>
  <text class="ink2" x="482" y="146" font-size="12.5" text-anchor="middle">virtual 7.1.4 driver</text>

  <!-- stage 3: AUSpatialMixer (accent) -->
  <rect class="box acc" x="653" y="72" width="280" height="88" rx="9"/>
  <text class="mono accf" x="793" y="107" font-size="17" text-anchor="middle">AUSpatialMixer</text>
  <text class="ink2" x="793" y="129" font-size="12.5" text-anchor="middle">personalized HRTF &#183;</text>
  <text class="ink2" x="793" y="146" font-size="12.5" text-anchor="middle">head tracking</text>

  <!-- stage 4: AirPods -->
  <rect class="box" x="979" y="72" width="190" height="88" rx="9"/>
  <text class="mono ink" x="1074" y="112" font-size="17" text-anchor="middle">AirPods</text>
  <text class="ink2" x="1074" y="134" font-size="12.5" text-anchor="middle">binaural output</text>

  <!-- connectors -->
  <g stroke="#5A5D64" stroke-width="1.4">
    <line x1="313" y1="116" x2="353" y2="116" marker-end="url(#ar)"/>
    <line x1="609" y1="116" x2="649" y2="116" marker-end="url(#ar)"/>
    <line x1="935" y1="116" x2="975" y2="116" marker-end="url(#ar)"/>
  </g>
</svg>
