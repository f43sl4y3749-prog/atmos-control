<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
  <title id="t">atmos-control</title>
  <desc id="d">Personalized, head-tracked Spatial Audio for macOS. An azimuth radar instrument shows a listener head at center with a cyan source dot; beside it the binaural-arcs mark, the wordmark, tagline, and a mono readout.</desc>
  <style>
    .ink{fill:#E9EAEC}.ink2{fill:#9A9DA2}.mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
    .grid{stroke:#33353A;fill:none}.scaf{stroke:#5A5D64;fill:none}.acc{fill:#57D1DB}
    .glow{fill:#57D1DB;filter:url(#soft);transform-box:fill-box;transform-origin:center;animation:breathe 5.5s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.30;transform:scale(.9)}50%{opacity:.62;transform:scale(1.12)}}
    @media (prefers-reduced-motion:reduce){.glow{animation:none;opacity:.42}}
  </style>
  <defs>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect x="1" y="1" width="1278" height="398" rx="14" fill="#161719" stroke="#26282C"/>

  <!-- Azimuth radar instrument -->
  <g stroke-width="1.4">
    <circle class="grid" cx="235" cy="200" r="150"/>
    <circle class="grid" cx="235" cy="200" r="104"/>
    <circle class="grid" cx="235" cy="200" r="58"/>
    <!-- cardinal azimuth ticks -->
    <g class="scaf" stroke-width="1.6">
      <line x1="235" y1="43" x2="235" y2="59"/>
      <line x1="235" y1="341" x2="235" y2="357"/>
      <line x1="78" y1="200" x2="94" y2="200"/>
      <line x1="376" y1="200" x2="392" y2="200"/>
    </g>
    <!-- front chevron (neutral scaffold, points down into the field) -->
    <path class="scaf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M224 39 L235 50 L246 39"/>
    <!-- ray from listener to source -->
    <line x1="235" y1="200" x2="291" y2="103" stroke="#57D1DB" stroke-opacity=".38" stroke-width="1.4"/>
  </g>
  <!-- listener head at center (neutral) -->
  <circle cx="235" cy="200" r="8.5" fill="#6C6F76"/>
  <!-- source dot with breathing glow (the one accent) -->
  <circle class="glow" cx="291" cy="103" r="15"/>
  <circle class="acc" cx="291" cy="103" r="6.5"/>

  <!-- slim elevation gauge -->
  <g>
    <path class="grid" stroke-width="1.4" d="M424 96 A118 118 0 0 1 424 304"/>
    <line class="scaf" stroke-width="1.4" x1="420" y1="200" x2="432" y2="200"/>
    <circle cx="426" cy="200" r="5" fill="#6C6F76"/>
  </g>

  <!-- hairline divider between instrument and text -->
  <line x1="480" y1="96" x2="480" y2="304" stroke="#26282C" stroke-width="1"/>

  <!-- binaural-arcs mark (the app glyph) -->
  <g fill="none" stroke="#C7C9CD" stroke-width="2.4" stroke-linecap="round">
    <path d="M537.30 100.98 A21.6 21.6 0 0 1 537.30 135.02"/>
    <path d="M532.87 106.65 A14.4 14.4 0 0 1 532.87 129.35"/>
    <path d="M510.70 135.02 A21.6 21.6 0 0 1 510.70 100.98"/>
    <path d="M515.13 129.35 A14.4 14.4 0 0 1 515.13 106.65"/>
  </g>
  <circle class="acc" cx="524" cy="118" r="7.5"/>

  <!-- wordmark + tagline + readout -->
  <text class="ink" x="524" y="212" font-size="66" font-weight="600" letter-spacing="-1.5">atmos-control</text>
  <text class="ink2" x="527" y="252" font-size="21" letter-spacing=".2">Personalized, head-tracked Spatial Audio for macOS</text>
  <circle class="acc" cx="533" cy="288" r="3.5"/>
  <text class="mono" x="548" y="294" font-size="18" fill="#B7B9BE" letter-spacing=".5">az +30&#176;<tspan dx="12" fill="#5E6167">&#183;</tspan><tspan dx="12">el +0&#176;</tspan><tspan dx="12" fill="#5E6167">&#183;</tspan><tspan dx="12">1.00 m</tspan></text>
</svg>
