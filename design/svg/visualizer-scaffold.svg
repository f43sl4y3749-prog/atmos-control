<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" font-family="ui-monospace, 'SF Mono', monospace">
  <title>Spatial visualizer scaffold — azimuth radar + elevation track</title>
  <desc>Static layer: horizontal-plane radar with distance rings, azimuth ticks, front notch, listener head; and a vertical elevation track. Live source dot is drawn dynamically.</desc>

  <!-- ===== Azimuth radar (top-down horizontal plane) ===== -->
  <g stroke="#6E6E73" fill="none">
    <!-- distance rings -->
    <circle cx="90" cy="90" r="80" stroke-opacity="0.9"/>
    <circle cx="90" cy="90" r="53" stroke-opacity="0.28"/>
    <circle cx="90" cy="90" r="27" stroke-opacity="0.28"/>
    <!-- azimuth ticks: front(0) right(90) back(180) left(-90) -->
    <g stroke-opacity="0.55" stroke-linecap="round">
      <line x1="90" y1="10" x2="90" y2="19"/>
      <line x1="90" y1="170" x2="90" y2="161"/>
      <line x1="10" y1="90" x2="19" y2="90"/>
      <line x1="170" y1="90" x2="161" y2="90"/>
    </g>
  </g>

  <!-- front notch (chevron) at 12 o'clock -->
  <path d="M85 7 L90 13 L95 7" fill="none" stroke="#57D1DB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- listener head at center, facing front (up) -->
  <g fill="#8E8E93">
    <circle cx="90" cy="92" r="6"/>
    <path d="M87 87 L93 87 L90 81 Z"/>
  </g>

  <!-- azimuth labels -->
  <g fill="#6E6E73" font-size="8" text-anchor="middle">
    <text x="90" y="27">0°</text>
    <text x="90" y="160">180°</text>
    <text x="150" y="93">90°</text>
    <text x="30" y="93">−90°</text>
  </g>

  <!-- faint source guide (live dot drawn dynamically here) -->
  <g stroke="#57D1DB" fill="none">
    <line x1="90" y1="90" x2="118" y2="50" stroke-opacity="0.18"/>
    <circle cx="118" cy="50" r="4.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  </g>

  <!-- ===== Elevation track (right) ===== -->
  <g>
    <line x1="212" y1="30" x2="212" y2="150" stroke="#6E6E73" stroke-opacity="0.9" stroke-linecap="round"/>
    <g stroke="#6E6E73" stroke-opacity="0.55" stroke-linecap="round">
      <line x1="207" y1="30" x2="217" y2="30"/>
      <line x1="205" y1="90" x2="219" y2="90"/>
      <line x1="207" y1="150" x2="217" y2="150"/>
    </g>
    <g fill="#6E6E73" font-size="8" text-anchor="end">
      <text x="203" y="33">+90°</text>
      <text x="203" y="93">0°</text>
      <text x="203" y="153">−90°</text>
    </g>
    <!-- faint elevation source guide -->
    <circle cx="212" cy="80" r="4" fill="none" stroke="#57D1DB" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  </g>
</svg>
