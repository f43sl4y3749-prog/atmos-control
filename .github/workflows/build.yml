name: Build App and Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -license accept

      - name: Make Scripts Executable
        run: chmod -R +x .

      - name: Build App
        run: bash App/build-app.sh release

      - name: Build Driver
        run: |
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGN_FLAGS="--deep --force --sign -"
          bash Driver/build.sh

      - name: Prepare Deliverables
        run: |
          mkdir -p build-output
          [ -d "dist/atmos-control.app" ] && cp -R dist/atmos-control.app build-output/
          find . -name "*.driver" -exec cp -R {} build-output/ \;

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmos-control-bundle
          path: build-output/
